[project]
name = "rig-overseer"
version = "0.1.0"
description = "Unattended GPU mining rig overseer with Claude as the decision layer"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
rigctl = "agent.rigctl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
