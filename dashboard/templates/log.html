{% extends "base.html" %}
{% block title %}Log — rig-overseer{% endblock %}
{% block content %}
<section class="filters" id="logf" role="toolbar" aria-label="Filters">
  <select id="f-host"><option value="">all hosts</option></select>
  <select id="f-gpu"><option value="">all GPUs</option></select>
  <select id="f-range"><option value="6">6h</option><option value="24" selected>24h</option><option value="168">7d</option><option value="720">30d</option><option value="">all</option></select>
  <select id="f-res"><option value="5m">5 min</option><option value="15s">15 s</option></select>
  <span class="spacer"></span>
  <a id="csv" class="chip" href="#" download>⤓ CSV</a>
</section>
<section class="card table-wrap">
  <table class="data" id="logt"><thead><tr>
    <th>time</th><th>host</th><th>gpu</th><th>hashrate</th><th>W</th><th>PL</th><th>core °C</th><th>mem °C</th><th>fan %</th><th>core MHz</th><th>mem MHz</th><th>acc/rej</th><th>throttle</th>
  </tr></thead><tbody></tbody></table>
  <button id="more" class="chip">load more</button>
</section>
{% endblock %}
{% block scripts %}<script>RO.log();</script>{% endblock %}
