# rig-overseer default configuration.
# Committed defaults. Per-host overrides go in config.local.yaml (gitignored) next to this
# file; it is deep-merged over these values. Secrets never go in either file: use
# environment variables or the secrets file (see secrets.file). Strings may reference
# environment variables as ${VAR}.

host:
  name: null            # null -> OS hostname
  role: hub             # hub | worker. Exactly one hub per fleet. Workers forward to hub.url.
  data_dir: null        # null -> %ProgramData%\rig-overseer (Windows) or /var/lib/rig-overseer (Linux)

hub:
  url: http://127.0.0.1:8080     # workers forward telemetry here; ignored on the hub itself
  forward_batch: 200
  forward_interval_s: 60
  bind: 127.0.0.1                # hub only: set to the Tailscale IP (100.x.y.z). Never 0.0.0.0 on a public NIC.
  port: 8080
  secure_cookies: false          # true when served via `tailscale serve` (HTTPS)
  bind_wait_s: 900               # at boot, wait up to this long for the bind address (Tailscale) before failing
  session_days: 30
  login_lockout_s: 60            # after 5 failed logins per client

secrets:
  file: null            # null -> <data_dir>/secrets.env ; KEY=VALUE lines, file mode 600 / owner-only ACL

db:
  path: null            # null -> <data_dir>/overseer.db
  retain_15s_hours: 48  # fast-resolution rows (watchdog) kept for incident bundles only
  retain_5m_days: 400

collector:
  interval_s: 300
  fast_interval_s: 15

gpu:
  backend: auto         # auto | nvml | sim
  control_backend: auto # auto (NVML, then the miner's OC API when NVML refuses) | nvml | miner
  sim:
    count: 2
    state_file: null    # null -> <data_dir>/sim_gpus.json (tests and fault injection poke this)
  # Memory-junction temperature sources, tried in order. NVML does not expose it on GeForce.
  memj_sources:
    - miner             # PeakMiner API, if it reports it
    - lhm               # LibreHardwareMonitor web server (Windows), see sensors.lhm_url
    - nvml_field        # NVML_FI_DEV_MEMORY_TEMP; works on HBM parts, usually unsupported on GeForce

sensors:
  lhm_url: http://127.0.0.1:8085/data.json   # LibreHardwareMonitor "Remote web server"; optional
  wall_power:
    provider: none      # none | shelly | kasa | tasmota
    url: null

miner:
  backend: auto         # auto (PeakMiner when it answers, else read-only SRBMiner started by the unMineable app) | peakminer | srbminer | sim
  srbminer:
    api_port: 21550     # fallback only: the port is read from the running SRBMiner command line
    relaunch_wait_s: 90 # after killing a stalled SRBMiner, how long to wait for the launcher to bring it back
  exe: C:\miners\peakminer\peakminer.exe
  managed: true         # the agent starts/stops/restarts the miner (do not also run start.bat by hand)
  kill_stalled_external: true   # unmanaged miner alive at 0 H/s for watchdog.zero_hashrate_s -> kill it so its launcher relaunches
  api_port: 4068        # bound to 127.0.0.1; key in secret PEAKMINER_API_KEY (generated on first start)
  api_control: [pause, oc]   # PeakMiner >= 2.20: per-GPU pause/resume and in-place OC writes via its API
  api_timeout_s: 3
  api_hashrate_unit: H/s     # PeakMiner /summary reports hashes per second
  coin: PRL             # catalog key below; algo/pool/dev fee come from coins.<COIN>
  worker: null          # null -> computer name
  temp_stop_c: 85       # miner's own thermal pause (first line of defence, independent of the watchdog)
  temp_start_c: 72
  extra_args: []        # e.g. ["--devices", "0,1"]

pool:
  provider: unmineable         # unmineable (paid in pool.unmineable.payout_coin) | kryptex (paid in the mined coin)
  fee_pct: 1.0                 # kryptex fee
  unmineable:
    payout_coin: BTC           # wallet = secret RIG_WALLET_BTC (e.g. your exchange BTC deposit address); used for stats lookups
    alias: ""                  # optional unMineable alias; when set the miner logs in as ALIAS.worker (same balance as that alias)
    referral: ""               # optional unMineable referral code: fee drops from 1% to 0.75%
    fee_pct: 1.0
    fee_pct_referral: 0.75
    urls:                      # stratum host per PeakMiner --coin name. UNVERIFIED: check unmineable.com
      pearl: pearlpow.unmineable.com:3333   # (advanced mode -> PearlPoW) and `rigctl pool probe`
    api_base: https://api.unminable.com/v4  # UNVERIFIED public stats API
    fields: {balance: data.balance, payment_threshold: data.payment_threshold, uuid: data.uuid, workers_root: data}
    verified: false
  # Kryptex stats: UNVERIFIED endpoints. ${WALLET} is replaced with secret RIG_WALLET_<COIN>.
  stats_url: https://pool.kryptex.com/api/v1/miner/prl/${WALLET}
  fields:                      # dotted paths into the JSON response; null = not provided
    hashrate: hashrate
    workers: workers_online
    balance: balance
    balance_usd: balance_usd
  cache_ttl_s: 600
  verified: false              # kryptex: set true once probe matches

economics:
  kwh_usd: 0.0
  switch_downtime_min: 5

# Coin catalog for the algorithm check. Only auto_switch: true coins may be switched to without the
# owner's OK. Each entry carries the miner command fragments for that coin. Wallet = secret RIG_WALLET_<COIN>.
# `algo` is PeakMiner's --coin name; dev fee 2% per its README (v2.20.5). A coin whose `miner` is not an
# installed backend is listed but never minable (Tari/Conflux need another miner: not integrated yet).
coins:
  PRL:  {name: Pearl,   algo: pearl,   miner: peakminer, pool: prl.kryptex.network:7048, dev_fee_pct: 2.0, auto_switch: true,
         fork_sensitive: true}                # PIP-3 (FP8) would end RTX 30/40 mining; see selector.fork
  QTC:  {name: Quantus, algo: quantus, miner: peakminer, pool: "stratum+tcp://qtc.kryptex.network:7049", dev_fee_pct: 2.0,
         auto_switch: true, hashrate_no_symbol: QUAN}                   # approved 2026-11-06 as the Pearl fallback. Under unmineable it needs a
                                              # pools.unmineable URL (none known yet); under kryptex it needs RIG_WALLET_QTC
  XTM:  {name: Tari C29, algo: cuckaroo29, miner: none, pool: xtm.kryptex.network:7033, dev_fee_pct: 0.0, auto_switch: true}
  CFX:  {name: Conflux, algo: octopus, miner: none, pool: cfx.kryptex.network:7030, dev_fee_pct: 0.0, auto_switch: true}
  IRON: {name: IronFish, algo: fishhash, miner: none, pool: iron.kryptex.network:7024, dev_fee_pct: 0.0, auto_switch: false}

selector:
  schedule: daily                 # daily | weekly (scheduler registration)
  min_gain_pct: 15                # switch only if the best alternative beats the current coin by this much ...
  consecutive_checks: 2           # ... on this many consecutive checks
  max_data_age_s: 21600           # never act on profitability data older than 6 h
  # Profitability source. `hashrate_no` (recommended): per-GPU-model estimates from hashrate.no, API key in
  # secret HASHRATE_NO_KEY. `manual` uses the seed table below (dashboard/tests only; never fresh enough to
  # trigger a switch). `http_json` is a generic per-coin fetcher (UNVERIFIED minerstat example).
  # Run `rigctl coins probe` on the rig, fix the field paths, then set verified: true.
  source:
    provider: hashrate_no         # hashrate_no | manual | http_json
    url: https://api.minerstat.com/v2/coins?list=${COINS}
    fields: {list: "", coin: coin, reward_per_unit_day: reward, unit: reward_unit, price_usd: price, updated: updated}
    verified: false
  hashrate_no:                    # v1 API: coins (per-coin USD estimate per hashrate unit) + gpuEstimates (best coin per GPU)
    base_url: https://api.hashrate.no/v1
    coins_endpoint: coins
    gpu_endpoint: gpuEstimates
    fetch_gpu_estimates: true     # second call per refresh, used as a cross-check in the Claude context
    gpu_map: {}                   # model-name substring -> hashrate.no GPU key when "RTX 3080" -> "3080" is wrong
    cache_ttl_s: 21600            # one refresh per 6 h at most (2 calls); free plan ~100 calls/month
    monthly_call_cap: 90
    verified: false               # set true once `rigctl coins probe` shows sane usd_per_hs values
  # Expected hashrate (H/s) and power (W) per GPU model per coin: the tuner updates these from telemetry;
  # seed values from Oct 30 2026 (Kryptex, RTX 3080).
  seed:
    as_of: "2026-10-30"
    "RTX 3080":
      PRL:  {hashrate: 105.0e12, power_w: 240, gross_usd_day: 2.11}
      QTC:  {hashrate: 488.0e6, power_w: 165, gross_usd_day: 1.69}
      XTM:  {hashrate: 1,      power_w: 192, gross_usd_day: 0.94}
      CFX:  {hashrate: 1,      power_w: 250, gross_usd_day: 0.79}
      IRON: {hashrate: 1,      power_w: 230, gross_usd_day: 0.45}
  fork:                           # Pearl PIP-3 watch; the daily check updates these via rigctl coins fork
    activation_height: null       # null = none announced
    minable_after_fork: ["RTX 50", "RTX PRO 6000", "H100", "H200", "B200", "B300"]

claude:
  bin: claude                     # Claude Code CLI on PATH (subscription token in secret CLAUDE_CODE_OAUTH_TOKEN)
  model: null                     # null = CLI default
  daily_cap: 10                   # scheduled + incident runs per day; incidents always run until 2x cap
  timeout_s: 900
  max_turns: 25
  max_budget_usd: 0.50            # only applied when an API key (not a subscription token) is used
  min_free_ram_mb: 1500           # scheduled runs are skipped below this; incident runs are not
  hourly_gating: true             # skip the LLM call when the deterministic pre-check finds no candidate
  schedule:
    hourly: "5 * * * *"           # minute 5 every hour (cron form; translated for Task Scheduler)
    algo_check: "30 3 * * *"      # 03:30 daily (weekly: "30 3 * * 1")

# Target operating envelope. Per-GPU overrides under gpus[].targets.
targets:
  core_c_max: 75
  memj_c_max: 100
  power_limit_pct_default: 70

# Hard clamps for the action API (M2). Matched by substring of the GPU model name; first match wins.
clamps:
  default:
    power_limit_pct: [55, 100]
    power_limit_step_pct: 5
    core_lock_mhz: [1200, 1950]
    core_offset_mhz: [-300, 150]
    core_step_mhz: 30
    mem_offset_mhz: [-500, 1200]
    mem_step_mhz: 100
    mem_lock_mhz: [5001, 10501]  # memory clock lock range (GDDR6X idles at 5001; a big power saver on core-bound algos)
    fan_pct: [40, 100]
    fan_step_pct: 10
  models:
    "RTX 3080":
      power_limit_pct: [55, 100]
      core_lock_mhz: [1200, 1950]
      mem_offset_mhz: [-500, 1200]
      # Measured on the EVGA FTW3 Ultra, pearlhash (docs/tuning-notes.md): core-bound; memory lock 5001
      # costs ~2.7 % hashrate and saves ~46 W. Stock 380 W = ~125 TH/s @ 377 W, 72 C.
      core_offset_mhz: [-300, 150]  # +175 caused nvlddmkm driver resets on rig1 (2026-11-06); +125 ran clean
      optimize_strategies:
        A: {pl_pct: 100, core_lock_mhz: [1800, 1700, 1600, 1400], mem_lock_mhz: 5001, mem_offset_mhz: 0}   # efficiency
        B: {pl_pct: 100, core_offset_mhz: [75, 100, 125], mem_offset_mhz: 0}                                # max hashrate
        C: {pl_pct: 100, core_lock_mhz: [1875, 1850, 1800], mem_lock_mhz: 5001, mem_offset_mhz: 0}          # cool/balanced

limits:
  miner_restarts_per_30min: 3
  coin_switches_per_day: 1
  reboots_per_day: 2
  psu_budget_w: 800              # continuous budget for this host (1000 W PSU at 80%)
  circuit_budget_w: 1440         # 15 A @ 120 V continuous

safety:
  dry_run: true                  # global. Control actions are logged but not applied.
  # Hard-limit protection (ladder + shutdown) also obeys dry_run unless this is true. Recommended true
  # once the rig is confirmed stable: the miner's own temperature pause remains the first line anyway.
  emergency_override_dry_run: false
  allow_shutdown: true           # watchdog may shut the PC down on a hard-limit breach
  shutdown_notice_s: 45          # push notification lead time before shutdown

watchdog:
  interval_s: 15
  # catastrophic conditions (sustained for `sustain_s` before acting)
  core_c_crit: 85
  memj_c_crit: 105
  sustain_s: 30
  core_c_hard: 95                # immediate stop + shutdown
  memj_c_hard: 110
  fan_fail_util_pct: 50          # 0 RPM / 0 % fan while util above this counts as fan failure
  fan_fail_sustain_s: 60
  zero_hashrate_s: 600           # miner running but 0 H/s, or miner down, for this long -> restart
  crash_loop_window_s: 900       # dying again within this after a rule restart = crash loop
  crash_loop_retry_s: 60         # fast retry in a crash loop; limits.miner_restarts_per_30min then stops it
  overpower_sustain_s: 30
  escalate_after_s: 60           # time at a ladder step before moving to the next
  recover_after_s: 600           # condition clear for this long before auto-recovery
  max_auto_recoveries_per_day: 3
  ladder_pl_floor_pct: 55        # ladder step 1 drops the power limit to this % of stock

notify:
  provider: ntfy                 # ntfy | none
  ntfy:
    url: https://ntfy.sh         # topic from secret NTFY_TOPIC, optional bearer NTFY_TOKEN
  cooldown_s: 600                # identical alert keys are suppressed within this window

tuning:
  hourly:
    trial_hold_s: 900            # 15 min trial window
    max_gpus_per_run: 1
    min_improve_pct: 1.0
    converge_after: 3            # consecutive non-improving trials -> converged
    converged_days: 7
    max_trials_per_gpu_per_day: 6
    trigger_temp_over_c: 0       # core temp above target by this much triggers tuning
    trigger_hashrate_drop_pct: 5
    trigger_eff_drop_pct: 5
  baseline_window_s: 900
  settle_s: 90                   # samples in the first settle_s after a change are ignored

optimize:                        # rigctl optimize / the /optimize slash command
  per_gpu_s: 2700                # hard window per GPU (45 min)
  rig_cap_s: 10800               # rig-wide cap (3 h)
  baseline_s: 600                # record current performance first
  hold_s: 300                    # per step (5-8 min is a stable reading); 45 min window -> ~2 steps per strategy
  steps: 4                       # max steps per strategy; the time budget usually cuts this
  worse_margin_pct: 3            # a step this much worse than baseline is reverted and ends the strategy
  default_goal: max-hashrate     # power is free here: revenue first, temperature targets still gate every step
  strategies:                    # per-model overrides under clamps.models.<name>.optimize_strategies
    A:                           # efficiency undervolt: lower core lock + reduced power limit + moderate memory
      pl_pct: [75, 70, 65, 60]
      core_lock_mhz: [1500, 1440, 1380, 1320]
      mem_offset_mhz: 300
    B:                           # max hashrate: stock power limit, core and memory offsets stepping up
      pl_pct: 100
      core_offset_mhz: [0, 30, 60, 90]
      mem_offset_mhz: [300, 500, 700, 900]
    C:                           # balanced / cool: mid power limit stepping down to the temperature target
      pl_pct: [80, 75, 70, 65]
      mem_offset_mhz: 200

gpus: []                         # per-GPU: {uuid, name, control_enabled, external_oc, external_profile, targets: {...}}
#  - uuid: GPU-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#    name: "3080 FTW3 #1"
#    control_enabled: false
#    external_oc: afterburner   # another tool owns the clocks: tuner/optimizer never touch this GPU (emergencies still act)
#    external_profile: {pl_w: 400, core_offset_mhz: 125, mem_offset_mhz: 0, fan_pct: 80}   # for the dashboard/context only

logging:
  level: INFO
  max_mb: 20
  backups: 5
